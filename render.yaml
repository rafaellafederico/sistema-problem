services:
  - type: web
    name: saint-germain-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NUVEMSHOP_STORE_ID
        sync: false
      - key: NUVEMSHOP_ACCESS_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ALERT_EMAIL
        sync: false
      - key: SITE_URL
        value: https://www.saintgermain.com.br
      - key: FRONTEND_URL
        sync: false
    healthCheckPath: /health
    autoDeploy: true
