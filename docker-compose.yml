version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# Saint Germain — Desenvolvimento Local
# Em produção: Frontend → Vercel | Backend → Render.com | DB → Supabase
# ─────────────────────────────────────────────────────────────────────────────

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sg-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - PORT=3001
      - NODE_ENV=development
    ports:
      - "3001:3001"
    networks:
      - sg-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  n8n:
    image: n8nio/n8n:latest
    container_name: sg-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - N8N_LOG_LEVEL=warn
      - BACKEND_URL=http://backend:3001
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/workflows:ro
    networks:
      - sg-network
    depends_on:
      - backend

networks:
  sg-network:
    driver: bridge

volumes:
  n8n_data:
