version: '3.9'

services:
  # ─── Frontend (Next.js) ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sg-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      - NEXT_PUBLIC_API_URL=http://backend:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - sg-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ─── Backend (Node.js Express) ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sg-backend
    restart: unless-stopped
    environment:
      - PORT=3001
      - NODE_ENV=production
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NUVEMSHOP_STORE_ID=${NUVEMSHOP_STORE_ID}
      - NUVEMSHOP_ACCESS_TOKEN=${NUVEMSHOP_ACCESS_TOKEN}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE_NAME=${EVOLUTION_INSTANCE_NAME}
      - WHATSAPP_GROUP_ID=${WHATSAPP_GROUP_ID}
      - ALERT_PHONE_NUMBER=${ALERT_PHONE_NUMBER}
      - SITE_URL=${SITE_URL:-https://www.saintgermain.com.br}
      - FRONTEND_URL=http://frontend:3000
    ports:
      - "3001:3001"
    networks:
      - sg-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ─── n8n (Workflow Automation) ───────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: sg-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-changeme123}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://${N8N_HOST:-localhost}:5678
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - N8N_LOG_LEVEL=warn
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=last
      - EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS=true
      - BACKEND_URL=http://backend:3001
      - SITE_URL=${SITE_URL:-https://www.saintgermain.com.br}
      - NUVEMSHOP_STORE_ID=${NUVEMSHOP_STORE_ID}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/workflows:ro
    networks:
      - sg-network
    depends_on:
      - backend

  # ─── Nginx (Reverse Proxy) ───────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: sg-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
      - n8n
    networks:
      - sg-network

networks:
  sg-network:
    driver: bridge
    name: sg-network

volumes:
  n8n_data:
    driver: local
